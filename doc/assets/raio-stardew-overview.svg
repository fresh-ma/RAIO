<svg width="960" height="560" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RAIO 像素农场式项目地图</title>
  <desc id="desc">以星露谷风格展示 RAIO 的主页、图书馆、大师之路、新闻、生活驿站和全局记忆。</desc>
  <style>
    .bg { fill: #18243a; }
    .field { fill: #2f7d4f; stroke: #21351f; stroke-width: 8; }
    .field2 { fill: #3f9b63; }
    .path { fill: #c79557; }
    .path2 { fill: #e2bd78; }
    .wood { fill: #8f5f35; stroke: #352216; stroke-width: 5; }
    .panel { fill: #f3d69b; stroke: #352216; stroke-width: 5; }
    .red { fill: #bd5248; stroke: #352216; stroke-width: 5; }
    .blue { fill: #4f7fbd; stroke: #352216; stroke-width: 5; }
    .gold { fill: #dda13a; stroke: #352216; stroke-width: 5; }
    .green { fill: #55a46b; stroke: #352216; stroke-width: 5; }
    .purple { fill: #7d69b5; stroke: #352216; stroke-width: 5; }
    .stone { fill: #b9b5a8; stroke: #352216; stroke-width: 5; }
    .ink { fill: #2f2118; font-family: "Courier New", monospace; font-weight: 700; }
    .cream { fill: #fff0c2; font-family: "Courier New", monospace; font-weight: 700; }
    .small { font-size: 17px; }
    .mid { font-size: 24px; }
    .big { font-size: 36px; }
    .pixel { shape-rendering: crispEdges; }
  </style>

  <rect class="bg pixel" width="960" height="560"/>
  <rect class="field pixel" x="70" y="70" width="820" height="420"/>
  <rect class="field2 pixel" x="92" y="92" width="776" height="376"/>

  <g class="pixel">
    <rect class="path" x="188" y="260" width="584" height="70"/>
    <rect class="path" x="445" y="128" width="70" height="304"/>
    <rect class="path2" x="212" y="278" width="536" height="34"/>
    <rect class="path2" x="462" y="148" width="36" height="264"/>
  </g>

  <g class="pixel">
    <rect class="panel" x="300" y="24" width="360" height="52"/>
    <text class="ink mid" x="480" y="58" text-anchor="middle">RAIO Research Farm</text>
  </g>

  <g class="pixel">
    <rect class="wood" x="350" y="178" width="260" height="154"/>
    <rect class="red" x="324" y="132" width="312" height="62"/>
    <rect class="panel" x="382" y="218" width="196" height="60"/>
    <text class="ink big" x="480" y="258" text-anchor="middle">Home</text>
    <rect fill="#5a3726" stroke="#352216" stroke-width="5" x="462" y="286" width="42" height="46"/>
    <rect fill="#ffd56b" x="498" y="306" width="8" height="8"/>
    <text class="cream small" x="480" y="356" text-anchor="middle">6 Agents + Radar</text>
  </g>

  <g class="pixel">
    <rect class="wood" x="124" y="112" width="176" height="122"/>
    <rect class="blue" x="102" y="78" width="220" height="48"/>
    <rect fill="#79adde" stroke="#352216" stroke-width="5" x="154" y="150" width="40" height="40"/>
    <rect fill="#79adde" stroke="#352216" stroke-width="5" x="230" y="150" width="40" height="40"/>
    <rect class="panel" x="138" y="250" width="148" height="40"/>
    <text class="ink small" x="212" y="276" text-anchor="middle">Library</text>
  </g>

  <g class="pixel">
    <rect class="stone" x="672" y="112" width="164" height="122"/>
    <rect class="gold" x="650" y="78" width="208" height="48"/>
    <rect fill="#7d69b5" stroke="#352216" stroke-width="5" x="724" y="150" width="58" height="58"/>
    <rect class="panel" x="688" y="250" width="132" height="40"/>
    <text class="ink small" x="754" y="276" text-anchor="middle">Learn</text>
  </g>

  <g class="pixel">
    <rect class="wood" x="126" y="354" width="176" height="104"/>
    <rect class="panel" x="148" y="378" width="132" height="46"/>
    <rect fill="#d95757" x="170" y="392" width="18" height="18"/>
    <rect fill="#4f7fbd" x="202" y="392" width="18" height="18"/>
    <rect fill="#55a46b" x="234" y="392" width="18" height="18"/>
    <text class="cream mid" x="214" y="482" text-anchor="middle">News</text>
  </g>

  <g class="pixel">
    <rect class="wood" x="660" y="354" width="176" height="104"/>
    <rect class="green" x="638" y="320" width="220" height="48"/>
    <rect fill="#ffd56b" stroke="#352216" stroke-width="5" x="728" y="390" width="56" height="44"/>
    <text class="cream mid" x="748" y="482" text-anchor="middle">Life</text>
  </g>

  <g class="pixel">
    <rect class="purple" x="360" y="430" width="240" height="64"/>
    <rect fill="#bba0df" stroke="#352216" stroke-width="5" x="392" y="402" width="176" height="34"/>
    <text class="cream mid" x="480" y="470" text-anchor="middle">Global Memory</text>
  </g>

  <g class="pixel" stroke="#352216" stroke-width="5" fill="none">
    <path d="M300 220 H350"/>
    <path d="M610 220 H672"/>
    <path d="M302 406 H330 V462 H360"/>
    <path d="M600 462 H630 V406 H660"/>
    <path d="M480 332 V402"/>
  </g>
</svg>
